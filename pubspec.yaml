name: golf_pos_app
description: "DriverPOS IO - Golf Course Point of Sale"
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation
  go_router: ^14.0.0
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Networking
  dio: ^5.4.3
  # Fonts & UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Utilities
  intl: ^0.19.0
  cryptography: ^2.7.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  # Socket.IO
  socket_io_client: ^3.0.2
  # Firebase
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.2.0
  # Logging
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/images/
